apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: easyshop-ns
spec:
  template:
    spec:
      containers: 
        - name: migration
          image: snehalpawar2945/easyshop-migration:1
          imagePullPolicy: Always
          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb-service:27017/easyshop"
      
      restartPolicy: OnFailure